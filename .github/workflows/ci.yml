# This workflow is the entry point for all CI processes.
# It is from here that all other workflows are launched.
name: Entry CI
on:
  workflow_call:
    inputs:
      distribution-channel:
        description: Distribution channel for release. It can be `release`, `beta`, `alpha` or any string.
        type: string
        required: true
      app-version-override:
        description: |
          Optional explicit version (e.g. "1.2.3"). When set, this replaces the version
          read from package.json. The release workflow passes the tag's version here so
          the produced artifacts match the tag even if package.json was not pre-bumped.
        type: string
        required: false
        default: ''

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}-${{inputs.distribution-channel}}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Prepare shared data for multi-platform compilation
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.APP_VERSION.outputs.APP_VERSION }}
      COMMIT_TIMESTAMP: ${{ steps.COMMIT_TIMESTAMP.outputs.COMMIT_TIMESTAMP }}
      APP_FULL_VERSION: ${{ steps.APP_FULL_VERSION.outputs.APP_FULL_VERSION }}
    steps:
      - uses: actions/checkout@v6
      - id: COMMIT_TIMESTAMP
        run: echo "COMMIT_TIMESTAMP=$(git show -s --format=%ct ${{ github.sha }})" >> $GITHUB_OUTPUT
      - id: APP_VERSION
        run: |
          if [ -n "${{ inputs.app-version-override }}" ]; then
            APP_VERSION="${{ inputs.app-version-override }}"
          else
            APP_VERSION="$(jq -r .version package.json)"
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
      - id: APP_FULL_VERSION
        run: |
          # The release channel ships plain semver (e.g. 0.0.8) so electron-updater treats it
          # as a stable build on the default 'latest' channel. Non-release channels get a
          # pre-release suffix so each commit produces a distinct, sortable version.
          if [ "${{ inputs.distribution-channel }}" = "release" ]; then
            APP_FULL_VERSION="${{ steps.APP_VERSION.outputs.APP_VERSION }}"
          else
            APP_FULL_VERSION="${{ steps.APP_VERSION.outputs.APP_VERSION }}-${{ inputs.distribution-channel }}.${{ steps.COMMIT_TIMESTAMP.outputs.COMMIT_TIMESTAMP }}"
          fi
          echo "APP_FULL_VERSION=$APP_FULL_VERSION" >> $GITHUB_OUTPUT
      - run: |
          echo "- \`COMMIT_TIMESTAMP\`: ${{ steps.COMMIT_TIMESTAMP.outputs.COMMIT_TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "- \`APP_VERSION\`: ${{ steps.APP_VERSION.outputs.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- \`APP_FULL_VERSION\`: ${{ steps.APP_FULL_VERSION.outputs.APP_FULL_VERSION }}" >> $GITHUB_STEP_SUMMARY

  compile-and-test:
    needs:
      - prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/compile-and-test.yml
    secrets: inherit
    with:
      app-version: ${{ needs.prepare.outputs.APP_FULL_VERSION }}
      distribution-channel: ${{inputs.distribution-channel}}
